name: Complete legacy text and resource cleanup
on:
  push:
    branches: [fix/final-branding-splash]
permissions:
  contents: write
jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[brand-audit-complete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python3 tools/brand_scrub.py
      - name: Commit corrected resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "brand: remove all legacy names and crown resources [brand-audit-complete]" && git push origin HEAD:fix/final-branding-splash)
