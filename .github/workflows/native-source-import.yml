name: Import authorized Android reference source
on:
  push:
    branches: [migration/reference-native-app]
permissions:
  contents: write
jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[native-import-complete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout Android reference
        run: git clone --depth 1 --branch master https://github.com/Vinaykpro/Ludo_King_Clone.git /tmp/ludomaster-native-reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import native Android source
        env:
          UPSTREAM_DIR: /tmp/ludomaster-native-reference
        run: python3 tools/import_native_reference.py
      - name: Commit import on migration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import authorized native Android presentation [native-import-complete]"
          git push origin HEAD:migration/reference-native-app
